name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Birim testleri (specs + png)
        run: pnpm test:specs && pnpm test:png

      - name: Playwright Chromium kur
        run: pnpm --filter @sas/render-service exec playwright install --with-deps chromium

      - name: Uçtan uca render (boyut + süreklilik + alfasız PNG)
        run: |
          pnpm render:set
          node -e '
            const b = require("fs").readFileSync("apps/render-service/out/set/panel-1.png");
            if (b[25] !== 2) { console.error("PNG alfasız değil! colorType=" + b[25]); process.exit(1); }
            console.log("PNG mağaza-uyumlu (24-bit RGB, alfasız) ✓");
          '
